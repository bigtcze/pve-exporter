name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go and golangci-lint via mise
        uses: jdx/mise-action@v5

      - name: Download dependencies
        run: mise exec -- go mod download

      - name: Run tests
        run: mise exec -- go test -v -race -coverprofile=coverage.out ./...

      - name: Run golangci-lint
        run: mise exec -- golangci-lint run

      - name: Build
        run: mise exec -- go build -v .

      - name: Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella


