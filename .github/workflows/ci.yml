name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly run so govulncheck reports newly published advisories.
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go and tools via mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Download dependencies
        run: mise exec -- go mod download

      - name: Run tests with race detector and coverage
        run: mise exec -- go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        run: mise exec -- scripts/check-coverage.sh coverage.out 80

      - name: Run golangci-lint
        run: mise exec -- golangci-lint run

      - name: Build
        run: mise exec -- go build -v .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage-func.txt
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up tools via mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Run gosec
        run: mise exec -- gosec ./...

      - name: Run govulncheck
        run: mise exec -- govulncheck ./...

      - name: Run gitleaks
        run: mise exec -- gitleaks git --redact .

  reproducible-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go and tools via mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Check reproducible release build
        run: mise exec -- scripts/check-reproducible.sh | tee checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-checksums
          path: checksums.txt
          if-no-files-found: error
