name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go and tools via mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Run golangci-lint
        run: mise exec -- golangci-lint run

      - name: Run tests
        run: mise exec -- go test -race ./...

      - name: Determine version
        id: version
        env:
          GITHUB_REF_NAME_FOR_VERSION: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF_NAME_FOR_VERSION" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF_NAME_FOR_VERSION#refs/tags/}
          else
            VERSION="v0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build binaries and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: mise exec -- scripts/build-release.sh "$RELEASE_VERSION" dist

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract release notes from tag
        id: release_notes
        env:
          GITHUB_REF_FOR_NOTES: ${{ github.ref }}
        run: |
          TAG_NAME=${GITHUB_REF_FOR_NOTES#refs/tags/}
          echo "Processing tag: $TAG_NAME"

          # Force fetch tags to ensure we have the tag object locally
          git fetch --tags --force

          # Use for-each-ref for precise extraction of annotated tag content
          RELEASE_NAME=$(git for-each-ref "refs/tags/$TAG_NAME" --format='%(contents:subject)')
          RELEASE_BODY=$(git for-each-ref "refs/tags/$TAG_NAME" --format='%(contents:body)')

          # If no body (e.g. lightweight tag or empty body), use subject
          if [ -z "$RELEASE_BODY" ]; then
             echo "Warning: No release body found. Using subject."
             RELEASE_BODY="$RELEASE_NAME"
          fi

          echo "Extracted Name: $RELEASE_NAME"

          echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pve-exporter-linux-amd64
            dist/pve-exporter-linux-arm64
            dist/pve-exporter-linux-armv7
            dist/checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/pve-exporter-linux-amd64
            dist/pve-exporter-linux-arm64
            dist/pve-exporter-linux-armv7
            dist/checksums.txt
          name: ${{ steps.release_notes.outputs.name }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
